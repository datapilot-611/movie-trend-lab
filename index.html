<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>映画公開カレンダー</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fb;
      color: #222;
    }

    .wrap {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    button {
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: #f1f5f9;
    }

    button.active {
      background: #111827;
      color: white;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .month-label {
      display: inline-block;
      min-width: 120px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 1px;
      background: #e5e7eb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
    }

    .weekday {
      background: #111827;
      color: white;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .day {
      min-height: 125px;
      background: white;
      padding: 7px;
      box-sizing: border-box;
      min-width: 0;
    }

    .day.empty {
      background: #f3f4f6;
    }

    .day-number {
      margin-bottom: 6px;
      color: #666;
      font-size: 13px;
      font-weight: 700;
    }

    .event {
      margin-bottom: 6px;
      padding: 6px 7px;
      border-left: 4px solid rgba(0, 0, 0, 0.18);
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.35;
      word-break: break-word;
      overflow: hidden;
    }

    .event-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 5px;
    }

    .event-title {
      display: block;
      flex: 1;
      min-width: 0;
      color: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      text-decoration: none;
    }

    .event-title:hover {
      text-decoration: underline;
    }

    .event-category {
      flex-shrink: 0;
      padding: 1px 5px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }

    .event-meta {
      margin-top: 3px;
      color: #333;
      font-size: 10px;
      line-height: 1.45;
    }

    .event-links {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .event-links a {
      color: #1d4ed8;
      font-size: 10px;
      font-weight: 700;
      text-decoration: none;
    }

    .event-links a:hover {
      text-decoration: underline;
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: #666;
      font-size: 12px;
    }

    .chip {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 4px;
      border-radius: 4px;
      vertical-align: -2px;
    }

    .empty-message {
      grid-column: 1 / -1;
      padding: 24px;
      background: white;
      color: #666;
      text-align: center;
    }

    @media (max-width: 760px) {
      .wrap {
        margin-top: 20px;
        padding: 0 10px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .calendar {
        min-width: 900px;
      }

      .calendar-scroll {
        overflow-x: auto;
        border-radius: 14px;
      }

      .day {
        min-height: 110px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="header">
      <h1>映画公開カレンダー</h1>

      <div>
        <button id="prev">‹ 前月</button>
        <span class="month-label" id="monthLabel"></span>
        <button id="next">翌月 ›</button>
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <div class="calendar-scroll">
      <section class="calendar" id="calendar"></section>
    </div>

    <div class="legend">
      <span>
        <span class="chip" style="background:#cfe2f3"></span>アニメ
      </span>

      <span>
        <span class="chip" style="background:#f4cccc"></span>洋画
      </span>

      <span>
        <span class="chip" style="background:#d9ead3"></span>邦画
      </span>

      <span>
        <span class="chip" style="background:#fff2cc"></span>特撮
      </span>
    </div>
  </main>

  <script>
    let events = [];
    let activeFilter = "すべて";

    const categoryColors = {
      "アニメ": "#cfe2f3",
      "洋画": "#f4cccc",
      "邦画": "#d9ead3",
      "特撮": "#fff2cc"
    };

    const weekdays = [
      "日",
      "月",
      "火",
      "水",
      "木",
      "金",
      "土"
    ];

    let current = new Date();

    const calendarEl = document.getElementById("calendar");
    const monthLabelEl = document.getElementById("monthLabel");
    const filtersEl = document.getElementById("filters");

    async function loadEvents() {
      try {
        const response = await fetch("./data.json");

        if (!response.ok) {
          throw new Error(
            `data.jsonの読み込みに失敗しました：${response.status}`
          );
        }

        const loadedData = await response.json();

        if (!Array.isArray(loadedData)) {
          throw new Error(
            "data.jsonの形式が配列ではありません"
          );
        }

        events = loadedData
          .filter(event => event && event.date && event.title)
          .map(event => ({
            date: String(event.date || ""),
            title: String(event.title || ""),
            category: String(event.category || ""),
            tohoUrl: String(event.tohoUrl || ""),
            dmmUrl: String(event.dmmUrl || ""),
            trendUrl: String(event.trendUrl || ""),
            dmmKeyword: String(event.dmmKeyword || ""),
            dmmCount: normalizeCount(event.dmmCount),
            relationType: String(event.relationType || "")
          }));

        setInitialMonth();
        renderFilters();
        renderCalendar();

      } catch (error) {
        console.error(error);

        calendarEl.innerHTML = `
          <div class="empty-message">
            data.jsonの読み込みに失敗しました
          </div>
        `;
      }
    }

    function normalizeCount(value) {
      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {
        return null;
      }

      const number = Number(value);

      return Number.isFinite(number)
        ? number
        : null;
    }

    function setInitialMonth() {
      const savedMonth = localStorage.getItem(
        "movieCalendarMonth"
      );

      if (savedMonth && /^\d{4}-\d{2}$/.test(savedMonth)) {
        const [year, month] = savedMonth
          .split("-")
          .map(Number);

        current = new Date(
          year,
          month - 1,
          1
        );

        return;
      }

      const futureEvents = events
        .filter(event => {
          const eventDate = parseDate(event.date);

          if (!eventDate) {
            return false;
          }

          const today = new Date();
          today.setHours(0, 0, 0, 0);

          return eventDate >= today;
        })
        .sort((a, b) => {
          return a.date.localeCompare(b.date);
        });

      const firstEvent = futureEvents[0] || events[0];

      if (firstEvent) {
        const eventDate = parseDate(firstEvent.date);

        if (eventDate) {
          current = new Date(
            eventDate.getFullYear(),
            eventDate.getMonth(),
            1
          );
        }
      }
    }

    function saveCurrentMonth() {
      const year = current.getFullYear();
      const month = String(
        current.getMonth() + 1
      ).padStart(2, "0");

      localStorage.setItem(
        "movieCalendarMonth",
        `${year}-${month}`
      );
    }

    function parseDate(dateString) {
      if (
        typeof dateString !== "string" ||
        !/^\d{4}-\d{2}-\d{2}$/.test(dateString)
      ) {
        return null;
      }

      const [year, month, day] = dateString
        .split("-")
        .map(Number);

      return new Date(
        year,
        month - 1,
        day
      );
    }

    function getFilteredEvents() {
      if (activeFilter === "すべて") {
        return events;
      }

      return events.filter(event => {
        return event.category === activeFilter;
      });
    }

    function renderFilters() {
      const categories = [
        "すべて",
        ...new Set(
          events
            .map(event => event.category)
            .filter(Boolean)
        )
      ];

      filtersEl.innerHTML = "";

      categories.forEach(category => {
        const button = document.createElement("button");

        button.textContent = category;
        button.className =
          category === activeFilter
            ? "active"
            : "";

        button.addEventListener("click", () => {
          activeFilter = category;

          renderFilters();
          renderCalendar();
        });

        filtersEl.appendChild(button);
      });
    }

    document
      .getElementById("prev")
      .addEventListener("click", () => {
        current.setMonth(
          current.getMonth() - 1
        );

        saveCurrentMonth();
        renderCalendar();
      });

    document
      .getElementById("next")
      .addEventListener("click", () => {
        current.setMonth(
          current.getMonth() + 1
        );

        saveCurrentMonth();
        renderCalendar();
      });

    function renderCalendar() {
      calendarEl.innerHTML = "";

      const filteredEvents = getFilteredEvents();

      const year = current.getFullYear();
      const month = current.getMonth();

      monthLabelEl.textContent =
        `${year}年${month + 1}月`;

      weekdays.forEach(day => {
        const weekday = document.createElement("div");

        weekday.className = "weekday";
        weekday.textContent = day;

        calendarEl.appendChild(weekday);
      });

      const firstDay = new Date(
        year,
        month,
        1
      );

      const lastDay = new Date(
        year,
        month + 1,
        0
      );

      for (
        let i = 0;
        i < firstDay.getDay();
        i++
      ) {
        const empty = document.createElement("div");

        empty.className = "day empty";

        calendarEl.appendChild(empty);
      }

      for (
        let day = 1;
        day <= lastDay.getDate();
        day++
      ) {
        const cell = document.createElement("div");

        cell.className = "day";

        const number = document.createElement("div");

        number.className = "day-number";
        number.textContent = day;

        cell.appendChild(number);

        const dateKey = [
          year,
          String(month + 1).padStart(2, "0"),
          String(day).padStart(2, "0")
        ].join("-");

        const todaysEvents = filteredEvents.filter(event => {
          return event.date === dateKey;
        });

        todaysEvents.forEach(event => {
          cell.appendChild(
            createEventCard(event)
          );
        });

        calendarEl.appendChild(cell);
      }
    }

    function createEventCard(event) {
      const item = document.createElement("div");

      item.className = "event";
      item.style.background =
        categoryColors[event.category] ||
        "#eeeeee";

      const header = document.createElement("div");
      header.className = "event-header";

      const title = document.createElement(
        event.tohoUrl ? "a" : "div"
      );

      title.className = "event-title";
      title.textContent = event.title;

      if (event.tohoUrl) {
        title.href = event.tohoUrl;
        title.target = "_blank";
        title.rel = "noopener noreferrer";
      }

      header.appendChild(title);

      if (event.category) {
        const category = document.createElement("span");

        category.className = "event-category";
        category.textContent = event.category;

        header.appendChild(category);
      }

      item.appendChild(header);

      const metaParts = [];

      if (event.relationType) {
        metaParts.push(event.relationType);
      }

      if (event.dmmKeyword) {
        metaParts.push(
          `DMM検索KW：${event.dmmKeyword}`
        );
      }

      if (event.dmmCount !== null) {
        metaParts.push(
          `関連作品数：${event.dmmCount}件`
        );
      }

      if (metaParts.length > 0) {
        const meta = document.createElement("div");

        meta.className = "event-meta";
        meta.textContent = metaParts.join(" / ");

        item.appendChild(meta);
      }

      const links = document.createElement("div");
      links.className = "event-links";

      if (event.dmmUrl) {
        const dmmLink = document.createElement("a");

        dmmLink.href = event.dmmUrl;
        dmmLink.target = "_blank";
        dmmLink.rel = "noopener noreferrer";
        dmmLink.textContent = "▶ DMM";

        links.appendChild(dmmLink);
      }

      if (event.trendUrl) {
        const trendLink = document.createElement("a");

        trendLink.href = event.trendUrl;
        trendLink.target = "_blank";
        trendLink.rel = "noopener noreferrer";
        trendLink.textContent = "📈 Trend";

        links.appendChild(trendLink);
      }

      if (links.children.length > 0) {
        item.appendChild(links);
      }

      return item;
    }

    loadEvents();
  </script>
</body>
</html>
