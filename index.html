<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>映画公開カレンダー</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f7f8fb;
      color: #222;
    }

    .wrap {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0;
    }

    button {
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: #f3f4f6;
    }

    button.active {
      background: #111827;
      color: white;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .month-label {
      display: inline-block;
      min-width: 120px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
    }

    /*
     * 縦型カレンダー全体
     */
    .calendar {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
    }

    /*
     * 1日分の行
     */
    .date-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      min-height: 36px;
      border-bottom: 1px solid #e5e7eb;
      align-items: stretch;
    }

    .date-row:last-child {
      border-bottom: none;
    }

    /*
     * 土日の背景
     */
    .date-row.sunday .date-area {
      background: #fff5f5;
    }

    .date-row.saturday .date-area {
      background: #f4f8ff;
    }

    /*
     * 左側の日付部分
     */
    .date-area {
      padding: 8px 12px;
      background: #fafafa;
      border-right: 1px solid #e5e7eb;
      box-sizing: border-box;
    }

    .date-main {
      font-size: 14px;
      font-weight: 700;
    }

    .date-weekday {
      margin-top: 4px;
      font-size: 12px;
      color: #666;
    }

    .sunday .date-main,
    .sunday .date-weekday {
      color: #dc2626;
    }

    .saturday .date-main,
    .saturday .date-weekday {
      color: #2563eb;
    }

    /*
     * 右側の作品カード表示部分
     */
    .movie-area {
      padding: 10px 12px;
      box-sizing: border-box;
    }

    .movie-list {
      display: grid;
      gap: 4px;
    }

    /*
     * 作品がない日の余白
     */
    .no-movie {
      min-height: 38px;
    }

    /*
     * 作品カード
     */
    .event {
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 12px;
      line-height: 1.5;
      border-left: 5px solid rgba(0, 0, 0, 0.18);
      box-sizing: border-box;
      word-break: break-word;
    }

    .event-title {
      display: block;
      margin-bottom: 3px;
      color: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .event-title:hover {
      text-decoration: underline;
    }

    .event-meta {
      color: #333;
      font-size: 12px;
    }

    .rank-s .event-title::before {
      content: "🔥 ";
    }

    .event-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .event-links a {
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .event-links a:hover {
      text-decoration: underline;
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      font-size: 12px;
      color: #666;
    }

    .chip {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 4px;
      border-radius: 4px;
      vertical-align: -2px;
    }

    .ranking {
      margin-top: 28px;
      padding: 16px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
    }

    .ranking h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .ranking-list {
      display: grid;
      gap: 8px;
    }

    .ranking-item {
      display: grid;
      grid-template-columns: 40px 1fr 90px 90px auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 13px;
    }

    .ranking-title {
      font-weight: 700;
    }

    .ranking-links a {
      margin-right: 8px;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .ranking-links a:hover {
      text-decoration: underline;
    }

    /*
     * スマートフォン表示
     */
    @media (max-width: 760px) {
      .wrap {
        margin: 20px auto;
        padding: 0 12px;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .date-row {
        grid-template-columns: 105px 1fr;
      }

      .date-area {
        padding: 12px 8px;
      }

      .movie-area {
        padding: 8px;
      }

      .date-main {
        font-size: 12px;
      }

      .event {
        padding: 8px 9px;
        font-size: 12px;
      }

      .event-title {
        font-size: 13px;
      }

      .ranking-item {
        grid-template-columns: 32px 1fr;
      }

      .ranking-item > div:nth-child(3),
      .ranking-item > div:nth-child(4),
      .ranking-item > div:nth-child(5) {
        grid-column: 2;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="header">
      <h1>映画公開カレンダー</h1>

      <div>
        <button id="prev">‹ 前月</button>
        <span class="month-label" id="monthLabel"></span>
        <button id="next">翌月 ›</button>
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <section class="calendar" id="calendar"></section>

    <div class="legend">
      <span>
        <span class="chip" style="background:#cfe2f3"></span>
        アニメ
      </span>

      <span>
        <span class="chip" style="background:#f4cccc"></span>
        洋画
      </span>

      <span>
        <span class="chip" style="background:#d9ead3"></span>
        邦画
      </span>

      <span>
        <span class="chip" style="background:#fff2cc"></span>
        特撮
      </span>

      <span>🔥 Sランク</span>
    </div>

    <section class="ranking">
      <h2>期待値ランキング TOP10</h2>
      <div class="ranking-list" id="rankingList"></div>
    </section>
  </main>

  <script>
    let events = [];
    let activeFilter = "すべて";

    const categoryColors = {
      "アニメ": "#cfe2f3",
      "洋画": "#f4cccc",
      "邦画": "#d9ead3",
      "特撮": "#fff2cc"
    };

    const weekdays = [
      "日曜日",
      "月曜日",
      "火曜日",
      "水曜日",
      "木曜日",
      "金曜日",
      "土曜日"
    ];

    /*
     * 最初に表示する月
     * 2026年6月
     */
    let current = new Date(2026, 5, 1);

    const calendarEl = document.getElementById("calendar");
    const monthLabelEl = document.getElementById("monthLabel");
    const filtersEl = document.getElementById("filters");
    const rankingListEl = document.getElementById("rankingList");

    async function loadEvents() {
      try {
        const response = await fetch("./data.json");

        if (!response.ok) {
          throw new Error("data.jsonを読み込めませんでした");
        }

        events = await response.json();

        renderFilters();
        renderCalendar();
        renderRanking();

      } catch (error) {
        console.error(error);

        calendarEl.innerHTML = `
          <div style="padding:16px;background:white;">
            data.jsonの読み込みに失敗しました
          </div>
        `;
      }
    }

    /*
     * 現在選択中のフィルターに応じて作品を絞り込む
     */
    function getFilteredEvents() {
      if (activeFilter === "すべて") {
        return events;
      }

      if (activeFilter === "Sランク") {
        return events.filter(event => event.rank === "S");
      }

      return events.filter(event => event.category === activeFilter);
    }

    /*
     * フィルターボタンを作る
     */
    function renderFilters() {
      const categories = [
        "すべて",
        ...new Set(
          events
            .map(event => event.category)
            .filter(Boolean)
        ),
        "Sランク"
      ];

      filtersEl.innerHTML = "";

      categories.forEach(category => {
        const button = document.createElement("button");

        button.textContent = category;
        button.className =
          category === activeFilter
            ? "active"
            : "";

        button.addEventListener("click", () => {
          activeFilter = category;

          renderFilters();
          renderCalendar();
          renderRanking();
        });

        filtersEl.appendChild(button);
      });
    }

    /*
     * 前月ボタン
     */
    document
      .getElementById("prev")
      .addEventListener("click", () => {
        current.setMonth(current.getMonth() - 1);
        current.setDate(1);

        renderCalendar();
      });

    /*
     * 翌月ボタン
     */
    document
      .getElementById("next")
      .addEventListener("click", () => {
        current.setMonth(current.getMonth() + 1);
        current.setDate(1);

        renderCalendar();
      });

    /*
     * 日付を縦に並べたカレンダーを表示
     */
    function renderCalendar() {
      calendarEl.innerHTML = "";

      const filteredEvents = getFilteredEvents();

      const year = current.getFullYear();
      const month = current.getMonth();

      monthLabelEl.textContent =
        `${year}年${month + 1}月`;

      /*
       * 対象月の最終日を取得
       */
      const lastDay = new Date(
        year,
        month + 1,
        0
      ).getDate();

      /*
       * 1日から末日まで、1行ずつ作成
       */
      for (let day = 1; day <= lastDay; day++) {
        const currentDate = new Date(
          year,
          month,
          day
        );

        const weekdayNumber = currentDate.getDay();

        const dateKey =
          `${year}-` +
          `${String(month + 1).padStart(2, "0")}-` +
          `${String(day).padStart(2, "0")}`;

        /*
         * この日に公開される作品だけ取得
         */
        const todaysEvents = filteredEvents
          .filter(event => event.date === dateKey)
          .sort(
            (a, b) =>
              Number(b.score || 0) -
              Number(a.score || 0)
          );

        /*
         * 1日分の行
         */
        const row = document.createElement("div");
        row.className = "date-row";

        if (weekdayNumber === 0) {
          row.classList.add("sunday");
        }

        if (weekdayNumber === 6) {
          row.classList.add("saturday");
        }

        /*
         * 左側の日付
         */
        const dateArea = document.createElement("div");
        dateArea.className = "date-area";

        const dateMain = document.createElement("div");
        dateMain.className = "date-main";
        dateMain.textContent =
          `${year}/${month + 1}/${day}`;

        const dateWeekday = document.createElement("div");
        dateWeekday.className = "date-weekday";
        dateWeekday.textContent =
          weekdays[weekdayNumber];

        dateArea.appendChild(dateMain);
        dateArea.appendChild(dateWeekday);

        /*
         * 右側の作品欄
         */
        const movieArea = document.createElement("div");
        movieArea.className = "movie-area";

        const movieList = document.createElement("div");
        movieList.className = "movie-list";

        if (todaysEvents.length === 0) {
          const empty = document.createElement("div");
          empty.className = "no-movie";

          movieList.appendChild(empty);
        } else {
          todaysEvents.forEach(event => {
            movieList.appendChild(
              createEventCard(event)
            );
          });
        }

        movieArea.appendChild(movieList);

        row.appendChild(dateArea);
        row.appendChild(movieArea);

        calendarEl.appendChild(row);
      }
    }

    /*
     * 作品カードを作成
     */
    function createEventCard(event) {
      const item = document.createElement("div");

      item.className =
        `event ${event.rank === "S" ? "rank-s" : ""}`;

      item.style.background =
        categoryColors[event.category] ||
        "#eeeeee";

      /*
       * 作品名
       * TOHO URLがある場合はリンクにする
       */
      const title = document.createElement(
        event.tohoUrl ? "a" : "div"
      );

      title.className = "event-title";
      title.textContent = event.title;

      if (event.tohoUrl) {
        title.href = event.tohoUrl;
        title.target = "_blank";
        title.rel = "noopener noreferrer";
      }

      /*
       * カテゴリ、ランク、期待値
       */
      const meta = document.createElement("div");
      meta.className = "event-meta";

      const score = Number(event.score || 0);

      meta.textContent =
        `${event.category || "カテゴリ未設定"} / ` +
        `${event.rank || "-"} / ` +
        `期待値 ${Math.round(score)}`;

      item.appendChild(title);
      item.appendChild(meta);

      /*
       * DMM・Trendリンク
       */
      const links = document.createElement("div");
      links.className = "event-links";

      if (event.dmmUrl) {
        const dmmLink = document.createElement("a");

        dmmLink.href = event.dmmUrl;
        dmmLink.target = "_blank";
        dmmLink.rel = "noopener noreferrer";
        dmmLink.textContent = "▶ DMM";

        links.appendChild(dmmLink);
      }

      if (event.trendUrl) {
        const trendLink = document.createElement("a");

        trendLink.href = event.trendUrl;
        trendLink.target = "_blank";
        trendLink.rel = "noopener noreferrer";
        trendLink.textContent = "📈 Trend";

        links.appendChild(trendLink);
      }

      if (links.children.length > 0) {
        item.appendChild(links);
      }

      return item;
    }

    /*
     * 期待値ランキングを表示
     */
    function renderRanking() {
      const filteredEvents = getFilteredEvents()
        .slice()
        .sort(
          (a, b) =>
            Number(b.score || 0) -
            Number(a.score || 0)
        )
        .slice(0, 10);

      rankingListEl.innerHTML = "";

      filteredEvents.forEach((event, index) => {
        const row = document.createElement("div");
        row.className = "ranking-item";

        const rank = document.createElement("div");
        rank.textContent = `${index + 1}位`;

        const title = document.createElement("div");
        title.className = "ranking-title";
        title.textContent = event.title;

        const date = document.createElement("div");
        date.textContent = formatDate(event.date);

        const score = document.createElement("div");
        score.textContent =
          `期待値 ${Math.round(Number(event.score || 0))}`;

        const links = document.createElement("div");
        links.className = "ranking-links";

        if (event.dmmUrl) {
          const dmm = document.createElement("a");

          dmm.href = event.dmmUrl;
          dmm.target = "_blank";
          dmm.rel = "noopener noreferrer";
          dmm.textContent = "DMM";

          links.appendChild(dmm);
        }

        if (event.trendUrl) {
          const trend = document.createElement("a");

          trend.href = event.trendUrl;
          trend.target = "_blank";
          trend.rel = "noopener noreferrer";
          trend.textContent = "Trend";

          links.appendChild(trend);
        }

        row.appendChild(rank);
        row.appendChild(title);
        row.appendChild(date);
        row.appendChild(score);
        row.appendChild(links);

        rankingListEl.appendChild(row);
      });
    }

    /*
     * 2026-06-03 → 6/3
     */
    function formatDate(dateString) {
      const date = new Date(
        dateString + "T00:00:00"
      );

      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    loadEvents();
  </script>
</body>
</html>
