<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>映画公開カレンダー</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #20242c;
    }
    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 28px auto 56px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 25px; }
    .month-nav { display: flex; align-items: center; gap: 10px; }
    .month-label { min-width: 120px; text-align: center; font-weight: 800; font-size: 18px; }
    button {
      border: 1px solid #dfe3ea;
      background: #fff;
      color: #252a34;
      border-radius: 9px;
      padding: 8px 13px;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { background: #f0f3f8; }
    button.active { background: #20242c; color: #fff; border-color: #20242c; }
    .filters {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 0 0 18px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .filter-label {
      width: 82px;
      flex-shrink: 0;
      color: #687080;
      font-size: 12px;
      font-weight: 800;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-row button {
      padding: 7px 12px;
      font-size: 12px;
    }

    .sort-note {
      color: #8a919e;
      font-size: 11px;
    }

    @media (max-width: 800px) {
      .filter-row {
        align-items: flex-start;
      }

      .filter-label {
        width: 100%;
      }
    }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .date-row {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid #e4e7ed;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(34, 42, 53, 0.04);
    }
    .date-label {
      position: sticky;
      top: 10px;
      padding-top: 3px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }
    .date-label .weekday { margin-left: 4px; color: #687080; font-size: 12px; }
    .movies { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .movie-card {
      display: grid;
      grid-template-columns: 1fr 320px 120px;
      gap: 12px;
      align-items: center;
      min-width: 0;
      padding: 9px 11px;
      border-left: 5px solid var(--category-color, #dfe3ea);
      border-radius: 10px;
      background: color-mix(in srgb, var(--category-color, #e8ebf0) 24%, white);
    }
    .movie-main {
      min-width: 0;
      padding-left: 38px;
    }
    .movie-title {
      display: block;
      color: inherit;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.4;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .movie-title:hover { text-decoration: underline; }
    .category-tag {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 7px;
      border: 1px solid rgba(0,0,0,.09);
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      font-size: 10px;
      font-weight: 800;
    }
    .movie-meta {
      min-width: 0;
      padding-left: 18px;
      color: #424956;
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;

      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .movie-links { display: flex; gap: 8px; justify-content: flex-end; white-space: nowrap; }
    .movie-links a {
      color: #2458b8;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
    }
    .movie-links a:hover { text-decoration: underline; }
    .empty-message {
      padding: 28px;
      border: 1px solid #e4e7ed;
      border-radius: 14px;
      background: #fff;
      color: #687080;
      text-align: center;
    }
    @media (max-width: 800px) {
      .wrap { width: min(100% - 20px, 1180px); margin-top: 18px; }
      .header { flex-direction: column; align-items: flex-start; }
      .date-row { grid-template-columns: 1fr; gap: 8px; }
      .date-label { position: static; }
      .movie-card { grid-template-columns: 1fr; gap: 5px; }
      .movie-links { justify-content: flex-start; }
    }
    .movie-links {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      width: 120px;
    }

    .movie-links a,
    .movie-link-placeholder {
      width: 55px;
      text-align: left;
      font-size: 11px;
      font-weight: 800;
    }

    .movie-link-placeholder {
      visibility: hidden;
    }
    .meta-row {
      display: grid;
      grid-template-columns: 82px 12px minmax(0, 1fr);
      align-items: start;
    }

    .meta-label {
      white-space: nowrap;
    }

    .meta-colon {
      text-align: center;
    }

    .meta-value {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .movie-card {
      position: relative;
      overflow: hidden;
    }

    .movie-card {
      position: relative;
      overflow: hidden;
    }

    .movie-new-ribbon {
      position: absolute;
      top: 0;
      left: 0;

      width: 46px;
      height: 46px;

      overflow: hidden;
      pointer-events: none;
      z-index: 20;
    }

    .movie-new-ribbon::before {
      content: "NEW";

      position: absolute;
      top: 9px;
      left: -16px;

      width: 70px;
      padding: 2px 0;

      background: linear-gradient(135deg, #ff5a5f, #ff2d55);
      color: #fff;
    
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .8px;
      text-align: center;

      transform: rotate(-45deg);

      box-shadow: 0 2px 6px rgba(0,0,0,.18);
    }
    .site-info {
      margin: 0 0 28px;
      padding: 16px 20px;
      background: #fff;
      border: 1px solid #e4e7ed;
      border-left: 5px solid #5b8def;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(34,42,53,.04);
    }

    .site-info-title {
      font-size: 15px;
      font-weight: 700;
      color: #2f3a4c;
      margin-bottom: 8px;
    }

    .site-info-text {
      font-size: 14px;
      line-height: 1.8;
      color: #555;
    }

    .site-info-text strong {
      color: #2f3a4c;
    }
  </style>
</head>
<body>
  <main class="wrap">
　<div class="header">
　  <h1>映画公開カレンダー</h1>
　
　  <div class="month-nav">
 　   <button id="prev">‹ 前月</button>
 　   <span class="month-label" id="monthLabel"></span>
　    <button id="next">翌月 ›</button>
  　</div>
　</div>

　<div class="site-info">
　  <div class="site-info-title">
　    ℹ️ このサイトについて
　  </div>

 　 <div class="site-info-text">
 　   <strong>
      　TOHOシネマズの公開予定作品をもとに、
     　 DMM TV関連作品数やGoogleトレンドをあわせて確認できる映画公開カレンダーです。
  　  </strong><br>
 　   公開前の作品リサーチやコンテンツ企画にご活用ください。
　  </div>
　</div>

　<div class="filters" id="filters"></div>
    <div class="filters" id="filters"></div>
    <section class="timeline" id="timeline"></section>
  </main>

  <script>
  let events = [];

  let activeGenreFilter = "すべて";
  let activeRelationFilter = "すべて";
  let activeSort = "タイトル順";

  let current = new Date();

  const categoryColors = {
    "アニメ": "#b9dcf3",
    "洋画": "#f3c7c7",
    "邦画": "#c9e8ce",
    "特撮": "#f7e5a8"
  };

  const timelineEl = document.getElementById("timeline");
  const monthLabelEl = document.getElementById("monthLabel");
  const filtersEl = document.getElementById("filters");

  async function loadEvents() {
    try {
      const response = await fetch("./data.json", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(
          `data.jsonの読み込みに失敗しました：${response.status}`
        );
      }

      const loadedData = await response.json();

      if (!Array.isArray(loadedData)) {
        throw new Error(
          "data.jsonの形式が配列ではありません"
        );
      }

      events = loadedData
        .filter(event => {
          return event && event.date && event.title;
        })
        .map(event => ({
          date: String(event.date || ""),
          title: String(event.title || ""),
          category: String(event.category || ""),
          tohoUrl: String(event.tohoUrl || ""),
          dmmUrl: String(event.dmmUrl || ""),
          trendUrl: String(event.trendUrl || ""),
          dmmKeyword: String(event.dmmKeyword || ""),
          dmmCount: normalizeCount(event.dmmCount),
          relationType: String(event.relationType || ""),
          newLabel: String(event.newLabel || "")
        }))
        .sort((a, b) => {
          return (
            a.date.localeCompare(b.date) ||
            a.title.localeCompare(b.title, "ja")
          );
        });

      setInitialMonth();
      renderFilters();
      renderTimeline();

    } catch (error) {
      console.error(error);

      timelineEl.innerHTML =
        '<div class="empty-message">' +
        'data.jsonの読み込みに失敗しました' +
        '</div>';
    }
  }

  function normalizeCount(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return null;
    }

    const number = Number(value);

    return Number.isFinite(number)
      ? number
      : null;
  }

  function parseDate(dateString) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
      return null;
    }

    const [year, month, day] =
      dateString.split("-").map(Number);

    return new Date(
      year,
      month - 1,
      day
    );
  }

  function setInitialMonth() {
    const saved =
      localStorage.getItem("movieCalendarMonth");

    if (
      saved &&
      /^\d{4}-\d{2}$/.test(saved)
    ) {
      const [year, month] =
        saved.split("-").map(Number);

      current = new Date(
        year,
        month - 1,
        1
      );

      return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const firstFuture = events.find(event => {
      const date = parseDate(event.date);

      return date && date >= today;
    });

    const base = firstFuture
      ? parseDate(firstFuture.date)
      : parseDate(events[0]?.date || "");

    if (base) {
      current = new Date(
        base.getFullYear(),
        base.getMonth(),
        1
      );
    }
  }

  function saveCurrentMonth() {
    const value =
      `${current.getFullYear()}-` +
      `${String(current.getMonth() + 1).padStart(2, "0")}`;

    localStorage.setItem(
      "movieCalendarMonth",
      value
    );
  }

  function renderFilters() {
    filtersEl.innerHTML = "";

    const genres = [
      "すべて",
      ...new Set(
        events
          .map(event => event.category)
          .filter(Boolean)
      )
    ];

    const relationTypes = [
      "すべて",
      ...new Set(
        events
          .map(event => event.relationType)
          .filter(Boolean)
      )
    ];

    const genreRow = createFilterRow(
      "ジャンル",
      genres,
      activeGenreFilter,
      value => {
        activeGenreFilter = value;
        renderFilters();
        renderTimeline();
      }
    );

    const relationRow = createFilterRow(
      "関連タイプ",
      relationTypes,
      activeRelationFilter,
      value => {
        activeRelationFilter = value;
        renderFilters();
        renderTimeline();
      }
    );

    const sortRow = createFilterRow(
      "並び順",
      [
        "タイトル順",
        "関連数順"
      ],
      activeSort,
      value => {
        activeSort = value;
        renderFilters();
        renderTimeline();
      }
    );

    filtersEl.append(
      genreRow,
      relationRow,
      sortRow
    );
  }

  function createFilterRow(
    labelText,
    options,
    activeValue,
    onSelect
  ) {
    const row = document.createElement("div");
    row.className = "filter-row";

    const label = document.createElement("div");
    label.className = "filter-label";
    label.textContent = labelText;

    const buttons = document.createElement("div");
    buttons.className = "filter-buttons";

    options.forEach(option => {
      const button =
        document.createElement("button");

      button.textContent = option;

      button.className =
        option === activeValue
          ? "active"
          : "";

      button.addEventListener(
        "click",
        () => onSelect(option)
      );

      buttons.appendChild(button);
    });

    row.append(
      label,
      buttons
    );

    return row;
  }

  function renderTimeline() {
    timelineEl.innerHTML = "";

    const year = current.getFullYear();
    const month = current.getMonth();

    monthLabelEl.textContent =
      `${year}年${month + 1}月`;

    const monthEvents = events.filter(event => {
      const date = parseDate(event.date);

      if (!date) {
        return false;
      }

      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month
      ) {
        return false;
      }

      const matchesGenre =
        activeGenreFilter === "すべて" ||
        event.category === activeGenreFilter;

      const matchesRelation =
        activeRelationFilter === "すべて" ||
        event.relationType === activeRelationFilter;

      return (
        matchesGenre &&
        matchesRelation
      );
    });

    if (monthEvents.length === 0) {
      timelineEl.innerHTML =
        '<div class="empty-message">' +
        'この条件に該当する作品はありません' +
        '</div>';

      return;
    }

    const grouped = new Map();

    monthEvents.forEach(event => {
      if (!grouped.has(event.date)) {
        grouped.set(event.date, []);
      }

      grouped
        .get(event.date)
        .push(event);
    });

    [...grouped.entries()]
      .sort((a, b) => {
        return a[0].localeCompare(b[0]);
      })
      .forEach(([dateKey, dayEvents]) => {
        const sortedEvents =
          sortDayEvents(dayEvents);

        timelineEl.appendChild(
          createDateRow(
            dateKey,
            sortedEvents
          )
        );
      });
  }

  function sortDayEvents(dayEvents) {
    const copied = [...dayEvents];

    if (activeSort === "関連数順") {
      return copied.sort((a, b) => {
        const countA =
          a.dmmCount === null
            ? -1
            : a.dmmCount;

        const countB =
          b.dmmCount === null
            ? -1
            : b.dmmCount;

        return (
          countB - countA ||
          a.title.localeCompare(
            b.title,
            "ja"
          )
        );
      });
    }

    return copied.sort((a, b) => {
      return a.title.localeCompare(
        b.title,
        "ja"
      );
    });
  }

  function createDateRow(
    dateKey,
    dayEvents
  ) {
    const row =
      document.createElement("article");

    row.className = "date-row";

    const date = parseDate(dateKey);

    const label =
      document.createElement("div");

    label.className = "date-label";

    label.innerHTML =
      `${date.getMonth() + 1}/${date.getDate()}` +
      `<span class="weekday">` +
      `（${["日", "月", "火", "水", "木", "金", "土"][date.getDay()]}）` +
      `</span>`;

    const movies =
      document.createElement("div");

    movies.className = "movies";

    dayEvents.forEach(event => {
      movies.appendChild(
        createMovieCard(event)
      );
    });

    row.append(
      label,
      movies
    );

    return row;
  }

  function createMovieCard(event) {
    const card =
      document.createElement("div");

    card.className = "movie-card";

    card.style.setProperty(
      "--category-color",
      categoryColors[event.category] ||
      "#dfe3ea"
    );

    if (
      String(event.newLabel || "")
        .trim()
        .toUpperCase() === "NEW"
    ) {
      const badge =
        document.createElement("div");

      badge.className =
        "movie-new-ribbon";

      card.appendChild(badge);
    }

    const main =
      document.createElement("div");

    main.className = "movie-main";

    const title =
      document.createElement(
        event.tohoUrl
          ? "a"
          : "div"
      );

    title.className = "movie-title";
    title.textContent = event.title;

    if (event.tohoUrl) {
      title.href = event.tohoUrl;
      title.target = "_blank";
      title.rel =
        "noopener noreferrer";
    }

    main.appendChild(title);

    if (event.category) {
      const tag =
        document.createElement("span");

      tag.className = "category-tag";
      tag.textContent = event.category;

      main.appendChild(tag);
    }

    const meta =
      document.createElement("div");

    meta.className = "movie-meta";

    const metaItems = [];

    if (event.dmmKeyword) {
      metaItems.push([
        "DMM検索KW",
        event.dmmKeyword
      ]);
    }

    if (event.dmmCount !== null) {
      metaItems.push([
        "関連作品数",
        `${event.dmmCount}件`
      ]);
    }

    if (event.relationType) {
      metaItems.push([
        "関連タイプ",
        event.relationType
      ]);
    }

    metaItems.forEach(
      ([labelText, valueText]) => {
        const row =
          document.createElement("div");

        row.className = "meta-row";

        const label =
          document.createElement("span");

        label.className = "meta-label";
        label.textContent = labelText;

        const colon =
          document.createElement("span");

        colon.className = "meta-colon";
        colon.textContent = "：";

        const value =
          document.createElement("span");

        value.className = "meta-value";
        value.textContent = valueText;

        row.append(
          label,
          colon,
          value
        );

        meta.appendChild(row);
      }
    );

    const links =
      document.createElement("div");

    links.className = "movie-links";

    links.appendChild(
      event.dmmUrl
        ? makeLink(
            event.dmmUrl,
            "🎬 DMM"
          )
        : makePlaceholder(
            "🎬 DMM"
          )
    );

    links.appendChild(
      event.trendUrl
        ? makeLink(
            event.trendUrl,
            "📈 Trend"
          )
        : makePlaceholder(
            "📈 Trend"
          )
    );

    card.append(
      main,
      meta,
      links
    );

    return card;
  }

  function makeLink(url, text) {
    const link =
      document.createElement("a");

    link.href = url;
    link.target = "_blank";
    link.rel =
      "noopener noreferrer";
    link.textContent = text;

    return link;
  }

  function makePlaceholder(text) {
    const span =
      document.createElement("span");

    span.className =
      "movie-link-placeholder";

    span.textContent = text;

    return span;
  }

  document
    .getElementById("prev")
    .addEventListener("click", () => {
      current = new Date(
        current.getFullYear(),
        current.getMonth() - 1,
        1
      );

      saveCurrentMonth();
      renderTimeline();
    });

  document
    .getElementById("next")
    .addEventListener("click", () => {
      current = new Date(
        current.getFullYear(),
        current.getMonth() + 1,
        1
      );

      saveCurrentMonth();
      renderTimeline();
    });

  loadEvents();
</script>
</body>
</html>
