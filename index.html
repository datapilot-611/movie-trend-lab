<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>映画公開カレンダー</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f7f8fb;
      color: #222;
    }

    .wrap {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      margin: 0;
    }

    button {
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .month-label {
      display: inline-block;
      min-width: 120px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #e5e7eb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
    }

    .weekday {
      background: #111827;
      color: white;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .day {
      min-height: 125px;
      background: white;
      padding: 8px;
      box-sizing: border-box;
    }

    .day.empty {
      background: #f3f4f6;
    }

    .day-number {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      margin-bottom: 6px;
    }

    .event {
      border-radius: 8px;
      padding: 6px 7px;
      margin-bottom: 6px;
      font-size: 12px;
      line-height: 1.35;
      border-left: 4px solid rgba(0,0,0,.18);
      word-break: break-word;
    }

    .event-title {
      font-weight: 700;
      margin-bottom: 2px;
    }

    .event-meta {
      color: #333;
      font-size: 11px;
    }

    .rank-s .event-title::before {
      content: "🔥 ";
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      font-size: 12px;
      color: #666;
    }

    .chip {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      display: inline-block;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="header">
      <h1>映画公開カレンダー</h1>
      <div>
        <button id="prev">‹ 前月</button>
        <span class="month-label" id="monthLabel"></span>
        <button id="next">翌月 ›</button>
      </div>
    </div>

    <section class="calendar" id="calendar"></section>

    <div class="legend">
      <span><span class="chip" style="background:#cfe2f3"></span>アニメ</span>
      <span><span class="chip" style="background:#f4cccc"></span>洋画</span>
      <span><span class="chip" style="background:#d9ead3"></span>邦画</span>
      <span><span class="chip" style="background:#fff2cc"></span>特撮</span>
      <span>🔥 Sランク</span>
    </div>
  </main>

  <script>
    let events = [];

    async function loadEvents() {
      try {
        const response = await fetch('./data.json');
    
        if (!response.ok) {
          throw new Error('data.jsonを読み込めませんでした');
        }

        events = await response.json();
        renderCalendar();
      } catch (error) {
        console.error(error);
        calendarEl.innerHTML = '<div style="padding:16px;background:white;">data.jsonの読み込みに失敗しました</div>';
      }
    }

loadEvents();
    const categoryColors = {
      "アニメ": "#cfe2f3",
      "洋画": "#f4cccc",
      "邦画": "#d9ead3",
      "特撮": "#fff2cc"
    };

    const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
    let current = new Date(2026, 5, 1);

    const calendarEl = document.getElementById("calendar");
    const monthLabelEl = document.getElementById("monthLabel");

    document.getElementById("prev").addEventListener("click", () => {
      current.setMonth(current.getMonth() - 1);
      renderCalendar();
    });

    document.getElementById("next").addEventListener("click", () => {
      current.setMonth(current.getMonth() + 1);
      renderCalendar();
    });

    function renderCalendar() {
      calendarEl.innerHTML = "";

      const year = current.getFullYear();
      const month = current.getMonth();

      monthLabelEl.textContent = `${year}年${month + 1}月`;

      weekdays.forEach(day => {
        const div = document.createElement("div");
        div.className = "weekday";
        div.textContent = day;
        calendarEl.appendChild(div);
      });

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      for (let i = 0; i < firstDay.getDay(); i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        calendarEl.appendChild(empty);
      }

      for (let day = 1; day <= lastDay.getDate(); day++) {
        const cell = document.createElement("div");
        cell.className = "day";

        const number = document.createElement("div");
        number.className = "day-number";
        number.textContent = day;
        cell.appendChild(number);

        const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const todaysEvents = events.filter(event => event.date === dateKey);

        todaysEvents.forEach(event => {
          const item = document.createElement("div");
          item.className = `event ${event.rank === "S" ? "rank-s" : ""}`;
          item.style.background = categoryColors[event.category] || "#eeeeee";

          const title = document.createElement("div");
          title.className = "event-title";
          title.textContent = event.title;

          const meta = document.createElement("div");
          meta.className = "event-meta";
          meta.textContent = `${event.category} / ${event.rank} / 期待値 ${Math.round(event.score)}`;

          item.appendChild(title);
          item.appendChild(meta);
          cell.appendChild(item);
        });

        calendarEl.appendChild(cell);
      }
    }

  </script>
</body>
</html>
