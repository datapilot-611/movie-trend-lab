  <script>
  let events = [];

  let activeGenreFilter = "すべて";
  let activeRelationFilter = "すべて";
  let activeSort = "タイトル順";

  let current = new Date();

  const categoryColors = {
    "アニメ": "#b9dcf3",
    "洋画": "#f3c7c7",
    "邦画": "#c9e8ce",
    "特撮": "#f7e5a8",
    "音楽コンテンツ": "#e6cff2"
  };

  const timelineEl = document.getElementById("timeline");
  const monthLabelEl = document.getElementById("monthLabel");
  const filtersEl = document.getElementById("filters");

  async function loadEvents() {
  try {
    const response = await fetch("./data.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        `data.jsonの読み込みに失敗しました：${response.status}`
      );
    }

    const loadedData = await response.json();

    if (
      !loadedData ||
      typeof loadedData !== "object" ||
      !Array.isArray(loadedData.movies)
    ) {
      throw new Error(
        "data.jsonの形式が正しくありません"
      );
    }

    const lastUpdateEl =
      document.getElementById("lastUpdate");

    if (lastUpdateEl) {
      lastUpdateEl.textContent =
        loadedData.lastUpdated || "----.--.--";
    }

    events = loadedData.movies
      .filter(event => {
        return (
          event &&
          event.date &&
          event.title
        );
      })
      .map(event => ({
        date: String(event.date || ""),
        title: String(event.title || ""),
        category: String(event.category || ""),
        tohoUrl: String(event.tohoUrl || ""),
        dmmUrl: String(event.dmmUrl || ""),
        trendUrl: String(event.trendUrl || ""),
        dmmKeyword: String(event.dmmKeyword || ""),
        dmmCount: normalizeCount(event.dmmCount),
        relationType: String(event.relationType || ""),
        newLabel: String(event.newLabel || "")
      }))
      .sort((a, b) => {
        return (
          a.date.localeCompare(b.date) ||
          a.title.localeCompare(
            b.title,
            "ja"
          )
        );
      });

    setInitialMonth();
    renderFilters();
    renderTimeline();

  } catch (error) {
    console.error(error);

    timelineEl.innerHTML =
      '<div class="empty-message">' +
      'data.jsonの読み込みに失敗しました' +
      '</div>';
  }
}

  function normalizeCount(value) {
    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return null;
    }

    const number = Number(value);

    return Number.isFinite(number)
      ? number
      : null;
  }

  function parseDate(dateString) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
      return null;
    }

    const [year, month, day] =
      dateString.split("-").map(Number);

    return new Date(
      year,
      month - 1,
      day
    );
  }

  function setInitialMonth() {
    const saved =
      localStorage.getItem("movieCalendarMonth");

    if (
      saved &&
      /^\d{4}-\d{2}$/.test(saved)
    ) {
      const [year, month] =
        saved.split("-").map(Number);

      current = new Date(
        year,
        month - 1,
        1
      );

      return;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const firstFuture = events.find(event => {
      const date = parseDate(event.date);

      return date && date >= today;
    });

    const base = firstFuture
      ? parseDate(firstFuture.date)
      : parseDate(events[0]?.date || "");

    if (base) {
      current = new Date(
        base.getFullYear(),
        base.getMonth(),
        1
      );
    }
  }

  function saveCurrentMonth() {
    const value =
      `${current.getFullYear()}-` +
      `${String(current.getMonth() + 1).padStart(2, "0")}`;

    localStorage.setItem(
      "movieCalendarMonth",
      value
    );
  }

  function renderFilters() {
  filtersEl.innerHTML = "";

  const newOptions = [
    "すべて",
    "NEW"
  ];

  const genres = [
    "すべて",
    ...new Set(
      events
        .map(event => event.category)
        .filter(Boolean)
    )
  ];

  const relationTypes = [
    "すべて",
    ...new Set(
      events
        .map(event => event.relationType)
        .filter(Boolean)
    )
  ];

  const newRow = createFilterRow(
    "NEW",
    newOptions,
    activeNewFilter,
    value => {
      activeNewFilter = value;
      renderFilters();
      renderTimeline();
    }
  );

  const genreRow = createFilterRow(
    "ジャンル",
    genres,
    activeGenreFilter,
    value => {
      activeGenreFilter = value;
      renderFilters();
      renderTimeline();
    }
  );

  const relationRow = createFilterRow(
    "関連タイプ",
    relationTypes,
    activeRelationFilter,
    value => {
      activeRelationFilter = value;
      renderFilters();
      renderTimeline();
    }
  );

  const sortRow = createFilterRow(
    "並び順",
    [
      "タイトル順",
      "関連数順"
    ],
    activeSort,
    value => {
      activeSort = value;
      renderFilters();
      renderTimeline();
    }
  );

  filtersEl.append(
    newRow,
    genreRow,
    relationRow,
    sortRow
  );
}

  function createFilterRow(
    labelText,
    options,
    activeValue,
    onSelect
  ) {
    const row = document.createElement("div");
    row.className = "filter-row";

    const label = document.createElement("div");
    label.className = "filter-label";
    label.textContent = labelText;

    const buttons = document.createElement("div");
    buttons.className = "filter-buttons";

    options.forEach(option => {
      const button =
        document.createElement("button");

      button.textContent = option;

      button.className =
        option === activeValue
          ? "active"
          : "";

      button.addEventListener(
        "click",
        () => onSelect(option)
      );

      buttons.appendChild(button);
    });

    row.append(
      label,
      buttons
    );

    return row;
  }

  function renderTimeline() {
    timelineEl.innerHTML = "";

    const year = current.getFullYear();
    const month = current.getMonth();

    monthLabelEl.textContent =
      `${year}年${month + 1}月`;

    const monthEvents = events.filter(event => {
      const date = parseDate(event.date);

      if (!date) {
        return false;
      }

      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month
      ) {
        return false;
      }

      const matchesGenre =
        activeGenreFilter === "すべて" ||
        event.category === activeGenreFilter;

      const matchesRelation =
        activeRelationFilter === "すべて" ||
        event.relationType === activeRelationFilter;

      return (
        matchesGenre &&
        matchesRelation
      );
    });

    if (monthEvents.length === 0) {
      timelineEl.innerHTML =
        '<div class="empty-message">' +
        'この条件に該当する作品はありません' +
        '</div>';

      return;
    }

    const grouped = new Map();

    monthEvents.forEach(event => {
      if (!grouped.has(event.date)) {
        grouped.set(event.date, []);
      }

      grouped
        .get(event.date)
        .push(event);
    });

    [...grouped.entries()]
      .sort((a, b) => {
        return a[0].localeCompare(b[0]);
      })
      .forEach(([dateKey, dayEvents]) => {
        const sortedEvents =
          sortDayEvents(dayEvents);

        timelineEl.appendChild(
          createDateRow(
            dateKey,
            sortedEvents
          )
        );
      });
  }

  function sortDayEvents(dayEvents) {
    const copied = [...dayEvents];

    if (activeSort === "関連数順") {
      return copied.sort((a, b) => {
        const countA =
          a.dmmCount === null
            ? -1
            : a.dmmCount;

        const countB =
          b.dmmCount === null
            ? -1
            : b.dmmCount;

        return (
          countB - countA ||
          a.title.localeCompare(
            b.title,
            "ja"
          )
        );
      });
    }

    return copied.sort((a, b) => {
      return a.title.localeCompare(
        b.title,
        "ja"
      );
    });
  }

  function createDateRow(
    dateKey,
    dayEvents
  ) {
    const row =
      document.createElement("article");

    row.className = "date-row";

    const date = parseDate(dateKey);

    const label =
      document.createElement("div");

    label.className = "date-label";

    label.innerHTML =
      `${date.getMonth() + 1}/${date.getDate()}` +
      `<span class="weekday">` +
      `（${["日", "月", "火", "水", "木", "金", "土"][date.getDay()]}）` +
      `</span>`;

    const movies =
      document.createElement("div");

    movies.className = "movies";

    dayEvents.forEach(event => {
      movies.appendChild(
        createMovieCard(event)
      );
    });

    row.append(
      label,
      movies
    );

    return row;
  }

  function createMovieCard(event) {
    const card =
      document.createElement("div");

    card.className = "movie-card";

    card.style.setProperty(
      "--category-color",
      categoryColors[event.category] ||
      "#dfe3ea"
    );

    if (
      String(event.newLabel || "")
        .trim()
        .toUpperCase() === "NEW"
    ) {
      const badge =
        document.createElement("div");

      badge.className =
        "movie-new-ribbon";

      card.appendChild(badge);
    }

    const main =
      document.createElement("div");

    main.className = "movie-main";

    const title =
      document.createElement(
        event.tohoUrl
          ? "a"
          : "div"
      );

    title.className = "movie-title";
    title.textContent = event.title;

    if (event.tohoUrl) {
      title.href = event.tohoUrl;
      title.target = "_blank";
      title.rel =
        "noopener noreferrer";
    }

    main.appendChild(title);

    if (event.category) {
      const tag =
        document.createElement("span");

      tag.className = "category-tag";
      tag.textContent = event.category;

      main.appendChild(tag);
    }

    const meta =
      document.createElement("div");

    meta.className = "movie-meta";

    const metaItems = [];

    if (event.dmmKeyword) {
      metaItems.push([
        "DMM検索KW",
        event.dmmKeyword
      ]);
    }

    if (event.dmmCount !== null) {
      metaItems.push([
        "関連作品数",
        `${event.dmmCount}件`
      ]);
    }

    if (event.relationType) {
      metaItems.push([
        "関連タイプ",
        event.relationType
      ]);
    }

    metaItems.forEach(
      ([labelText, valueText]) => {
        const row =
          document.createElement("div");

        row.className = "meta-row";

        const label =
          document.createElement("span");

        label.className = "meta-label";
        label.textContent = labelText;

        const colon =
          document.createElement("span");

        colon.className = "meta-colon";
        colon.textContent = "：";

        const value =
          document.createElement("span");

        value.className = "meta-value";
        value.textContent = valueText;

        row.append(
          label,
          colon,
          value
        );

        meta.appendChild(row);
      }
    );

    const links =
      document.createElement("div");

    links.className = "movie-links";

    links.appendChild(
      event.dmmUrl
        ? makeLink(
            event.dmmUrl,
            "🎬 DMM"
          )
        : makePlaceholder(
            "🎬 DMM"
          )
    );

    links.appendChild(
      event.trendUrl
        ? makeLink(
            event.trendUrl,
            "📈 Trend"
          )
        : makePlaceholder(
            "📈 Trend"
          )
    );

    card.append(
      main,
      meta,
      links
    );

    return card;
  }

  function makeLink(url, text) {
    const link =
      document.createElement("a");

    link.href = url;
    link.target = "_blank";
    link.rel =
      "noopener noreferrer";
    link.textContent = text;

    return link;
  }

  function makePlaceholder(text) {
    const span =
      document.createElement("span");

    span.className =
      "movie-link-placeholder";

    span.textContent = text;

    return span;
  }

  document
    .getElementById("prev")
    .addEventListener("click", () => {
      current = new Date(
        current.getFullYear(),
        current.getMonth() - 1,
        1
      );

      saveCurrentMonth();
      renderTimeline();
    });

  document
    .getElementById("next")
    .addEventListener("click", () => {
      current = new Date(
        current.getFullYear(),
        current.getMonth() + 1,
        1
      );

      saveCurrentMonth();
      renderTimeline();
    });

  loadEvents();
</script>
</body>
</html>
