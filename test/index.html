
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>映画公開カレンダー</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #5b2f1c;
      background-color: #fbe2b7;
    }


    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }


    /* =========================================================
       PAGE BACKGROUND LAYERS
       上部・中間・下部はすべて「背景専用」。
       UI（サイト説明・フィルター・カード）は背景とは独立して前面に流す。
    ========================================================= */

    :root {
      --movie-seam-color: #fbe2b7;
      --middle-fade: clamp(90px, 8vw, 150px);
      --bottom-blend-zone: 560px;
      --top-image-height: calc(100vw * 916 / 1717);
    }

    body {
      margin: 0;
      min-height: 0;
      color: #5b2f1c;
      background-color: var(--movie-seam-color);
    }

    /*
      ページの高さは前面コンテンツ（フィルター＋カレンダーカード）の高さだけ。
      背景画像のための余白・最低高さは一切足さない。
    */
    .page-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      isolation: isolate;
      background-color: var(--movie-seam-color);
    }

    .background-stage {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* 上部画像は従来どおり切り取らず表示 */
    .bg-top-image {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      pointer-events: none;
      user-select: none;
    }

    /*
      中間背景は上部との接続からページ末尾まで存在。
      カード数が少なければ短く、多ければその分だけ伸びる。
    */
    .bg-middle-layer {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      top: calc(var(--top-image-height) - var(--middle-fade));
      bottom: 0;

      background-image: url("./movie-bg-middle.webp");
      background-repeat: repeat-y;
      background-position: center top;
      background-size: 100% auto;

      /*
        中部はページ末尾まで常に残す。
        下側では中部そのものを消さない。
        下部画像を上から透明→不透明で重ねることで、
        見た目として自然なクロスフェードにする。
      */
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0,
        #000 var(--middle-fade),
        #000 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0,
        #000 var(--middle-fade),
        #000 100%
      );
    }

    /*
      下部は最後のカード付近にだけ重ねる。
      wrapper 自体をフェードさせるので、画像上端の境界線は出ない。
      中部は下に残っているため、透明部分では必ず中部が見える。
    */
    .bg-bottom-wrap {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--bottom-blend-zone);
      max-height: 100%;
      overflow: hidden;
      pointer-events: none;

      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,.08) 10%,
        rgba(0,0,0,.22) 24%,
        rgba(0,0,0,.45) 44%,
        rgba(0,0,0,.68) 64%,
        rgba(0,0,0,.86) 82%,
        #000 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,.08) 10%,
        rgba(0,0,0,.22) 24%,
        rgba(0,0,0,.45) 44%,
        rgba(0,0,0,.68) 64%,
        rgba(0,0,0,.86) 82%,
        #000 100%
      );
    }

    .bg-bottom-image {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      bottom: 0;
      display: block;
      width: 100%;
      height: auto;
      max-width: none;
      pointer-events: none;
      user-select: none;
    }

    /* UIは背景より常に前面。高さは中身そのものに合わせる */
    .page-content {
      position: relative;
      z-index: 10;
      min-height: 0;
      padding-bottom: 0;
    }

    /*
      movie-heroはもう背景画像の箱ではない。
      ロゴ・月移動・サイト説明を配置するためだけのUI領域。
      高さを上部画像より短くして、フィルターとカードを上部背景上から開始させる。
    */
    .movie-hero {
      position: relative;
      z-index: 11;
      width: 100%;
      height: clamp(560px, 35vw, 610px);
      min-height: 560px;
      overflow: visible;
      background: transparent;
    }

    /* 旧page-middleは「本文コンテンツ」の箱としてだけ使う */
    .page-middle {
      position: relative;
      z-index: 12;
      width: 100%;
      padding: 0;
      margin: -55px 0 0;
      background: transparent;
    }

    .page-middle > .wrap {
      position: relative;
      z-index: 13;
    }

    /* 旧下部ブロックは背景画像を持たせない。レイアウト上も不要 */
    .page-bottom {
      display: none;
    }

    /* =========================================================
   HERO LOGO
   ロゴ本体の位置は維持
   後ろに白い楕円状のふんわりグローを表示
========================================================= */

.movie-hero-logo-wrap {
  position: absolute;
  z-index: 3;

  top: 120px;

  left: max(
    26px,
    calc((100vw - 1180px) / 2 + 26px)
  );

  width: min(760px, 66%);

  pointer-events: none;
}


/* 白いふんわり背景 */
.movie-hero-logo-wrap::before {
  content: "";

  position: absolute;
  z-index: 0;

  /* ロゴの中央 */
  top: 50%;
  left: 50%;

  /* ロゴより少し大きい楕円 */
  width: 112%;
  height: 82%;

  transform: translate(-50%, -50%);

  background:
    radial-gradient(
      ellipse at center,
      rgba(255, 255, 255, 0.88) 0%,
      rgba(255, 255, 255, 0.78) 18%,
      rgba(255, 255, 255, 0.60) 38%,
      rgba(255, 255, 255, 0.36) 58%,
      rgba(255, 255, 255, 0.16) 74%,
      rgba(255, 255, 255, 0.05) 88%,
      rgba(255, 255, 255, 0) 100%
    );

  filter: blur(18px);

  border-radius: 50%;

  pointer-events: none;
}


/* ロゴ画像本体 */
.movie-hero-logo {
  position: relative;
  z-index: 1;

  display: block;

  width: 100%;
  max-height: 215px;
  height: auto;

  object-fit: contain;
  object-position: left top;

  /* ロゴ画像自体には背景を付けない */
  background: none;
  border-radius: 0;
  box-shadow: none;

  filter:
    drop-shadow(
      0 8px 12px
      rgba(90, 52, 34, 0.08)
    );

  pointer-events: none;
  user-select: none;
}

 /* =========================================================
   MONTH NAV
   フィルター直上に配置
========================================================= */

.movie-hero-nav {
  position: relative;
  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: flex-end;

  gap: 12px;

  width: 100%;

  margin: 0 0 12px;
  padding: 0 8px;
}


/* 前月・翌月ボタン */
.movie-hero-nav button {
  appearance: none;
  -webkit-appearance: none;

  flex: 0 0 auto;

  min-width: 72px;
  height: 34px;

  padding: 0 14px;

  border:
    1px solid
    rgba(177, 111, 77, 0.18);

  border-radius: 999px;

  background:
    rgba(255, 255, 255, 0.92);

  color: #70402d;

  font-family: inherit;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;

  white-space: nowrap;

  cursor: pointer;

  box-shadow:
    0 4px 12px
    rgba(119, 67, 42, 0.08);

  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);

  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease;
}


.movie-hero-nav button:hover {
  border-color:
    rgba(177, 111, 77, 0.34);

  background: #fffaf6;

  transform: translateY(-1px);
}


/* 2026年10月 */
.movie-hero-nav .month-label {
  min-width: 108px;

  color: #70402d;

  font-size: 17px;
  font-weight: 900;

  text-align: center;
  white-space: nowrap;
}


    /* =========================================================
       SITE INFO
    ========================================================= */

    .movie-hero-info {
      position: absolute;
      z-index: 5;

      left: max(
        18px,
        calc((100vw - 1180px) / 2)
      );

      right: max(
        18px,
        calc((100vw - 1180px) / 2)
      );

      top: 325px;
      bottom: auto;

      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 26px;

      padding: 15px 18px;

      border:
        1px solid
        rgba(255, 255, 255, 0.62);

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.84);

      box-shadow:
        0 9px 24px
        rgba(106, 63, 41, 0.07);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .movie-hero-info-main {
      min-width: 0;
      max-width: 850px;
    }

    .movie-hero-info-title {
      display: flex;
      align-items: center;

      gap: 8px;

      margin-bottom: 6px;

      color: #5b3827;

      font-size: 15px;
      font-weight: 900;
      line-height: 1.3;
    }

    .movie-hero-description {
      color: #56463f;

      font-size: 12px;
      font-weight: 700;
      line-height: 1.6;
    }

    .notice {
  display: flex;
  align-items: flex-start;
  gap: 5px;
  margin-top: 5px;

  color: #94847c;
  font-size: 10px;
  line-height: 1.5;
}

.notice-icon {
  flex: 0 0 auto;
  line-height: 1.5;
}

.notice-body {
  min-width: 0;
}

.notice-body > div {
  margin: 0;
}
    
    .movie-hero-update {
      flex-shrink: 0;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 7px 11px;

      border:
        1px solid
        rgba(212, 153, 116, 0.16);

      border-radius: 999px;

      background:
        rgba(255, 247, 239, 0.94);

      white-space: nowrap;
    }

    .movie-hero-update span {
      color: #a06c51;

      font-size: 8px;
      font-weight: 800;
      letter-spacing: .14em;

      text-transform: uppercase;
    }

    .movie-hero-update span::before {
      content: "✦";

      margin-right: 6px;

      color: #e4a04b;
    }

    .movie-hero-update time {
      color: #70452f;

      font-size: 11px;
      font-weight: 800;
    }


    /* =========================================================
       FILTERS
       ヘッダーと本文の境界をまたぐ
    ========================================================= */

    .filters {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 0 0 18px;
  padding: 16px 18px;
  border: 1px solid rgba(231, 190, 160, 0.42);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.62);
  box-shadow: 0 7px 22px rgba(126, 76, 48, 0.04);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 8px;
    }

    .filter-label {
      width: 82px;
      flex-shrink: 0;

      color: #806d64;

      font-size: 12px;
      font-weight: 800;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;
    }

    .filter-row button {
      padding: 7px 12px;

      border:
        1px solid
        #eadfd7;

      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.92);

      color: #5f514a;

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background .18s ease,
        transform .18s ease,
        border-color .18s ease;
    }

    .filter-row button:hover {
      border-color: #d9bca9;

      background: #fff8f2;

      transform:
        translateY(-1px);
    }

    .filter-row button.active {
      border-color: #70402d;

      background: #70402d;

      color: #fff;
    }

    .sort-note {
      color: #9a8d86;

      font-size: 11px;
    }


    /* =========================================================
       TIMELINE
    ========================================================= */

    .timeline {
      display: flex;
      flex-direction: column;

      gap: 10px;

      /* 最後のカレンダーカード下にだけ余白を確保 */
      padding-bottom: 30px;
    }

    .date-row {
      display: grid;

      grid-template-columns:
        120px
        minmax(0, 1fr);

      gap: 14px;

      align-items: start;

      padding: 12px 14px;

      border:
        1px solid
        rgba(231, 190, 160, 0.45);

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.72);

      box-shadow:
        0 8px 24px
          rgba(157, 93, 55, 0.06),
        inset 0 1px 0
          rgba(255, 255, 255, 0.95);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .date-label {
      position: sticky;
      top: 10px;

      padding-top: 3px;

      color: #5b3827;

      font-size: 15px;
      font-weight: 800;

      white-space: nowrap;
    }

    .date-label .weekday {
      margin-left: 4px;

      color: #88756b;

      font-size: 12px;
    }

    .movies {
      display: flex;
      flex-direction: column;

      gap: 8px;

      min-width: 0;
    }


    /* =========================================================
       MOVIE CARD
    ========================================================= */

    .movie-card {
      position: relative;

      display: grid;

      grid-template-columns:
        1fr
        320px
        120px;

      gap: 12px;

      align-items: center;

      min-width: 0;

      padding: 9px 11px;

      overflow: hidden;

      border-left:
        5px solid
        var(
          --category-color,
          #dfe3ea
        );

      border-radius: 10px;

      background:
        color-mix(
          in srgb,
          var(
            --category-color,
            #e8ebf0
          ) 24%,
          white
        );
    }

    .movie-main {
      min-width: 0;

      padding-left: 38px;
    }

    .movie-title {
      display: block;

      color: inherit;

      font-size: 16px;
      font-weight: 800;
      line-height: 1.4;

      text-decoration: none;

      overflow-wrap: anywhere;
    }

    .movie-title:hover {
      text-decoration: underline;
    }

    .category-tag {
      display: inline-block;

      margin-top: 4px;

      padding: 2px 7px;

      border:
        1px solid
        rgba(0, 0, 0, .09);

      border-radius: 999px;

      background:
        rgba(255, 255, 255, .7);

      font-size: 10px;
      font-weight: 800;
    }


    /* =========================================================
       MOVIE META
    ========================================================= */

    .movie-meta {
      display: flex;
      flex-direction: column;

      gap: 2px;

      min-width: 0;

      padding-left: 18px;

      color: #514a46;

      font-size: 12px;
      line-height: 1.45;

      overflow-wrap: anywhere;
    }

    .meta-row {
      display: grid;

      grid-template-columns:
        82px
        12px
        minmax(0, 1fr);

      align-items: start;
    }

    .meta-label {
      white-space: nowrap;
    }

    .meta-colon {
      text-align: center;
    }

    .meta-value {
      min-width: 0;

      overflow-wrap: anywhere;
    }


    /* =========================================================
       LINKS
    ========================================================= */

    .movie-links {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      width: 120px;

      white-space: nowrap;
    }

    .movie-links a,
    .movie-link-placeholder {
      width: 55px;

      color: #8e5138;

      font-size: 11px;
      font-weight: 800;

      text-align: left;
      text-decoration: none;
    }

    .movie-links a:hover {
      text-decoration: underline;
    }

    .movie-link-placeholder {
      visibility: hidden;
    }


    /* =========================================================
       NEW RIBBON
    ========================================================= */

    .movie-new-ribbon {
      position: absolute;

      top: 0;
      left: 0;

      z-index: 20;

      width: 46px;
      height: 46px;

      overflow: hidden;

      pointer-events: none;
    }

    .movie-new-ribbon::before {
      content: "NEW";

      position: absolute;

      top: 9px;
      left: -16px;

      width: 70px;

      padding: 2px 0;

      background:
        linear-gradient(
          135deg,
          #ff6f69,
          #ed5268
        );

      color: #fff;

      box-shadow:
        0 2px 6px
        rgba(0, 0, 0, .18);

      font-size: 9px;
      font-weight: 800;
      letter-spacing: .8px;

      text-align: center;

      transform:
        rotate(-45deg);
    }


    /* =========================================================
       EMPTY MESSAGE
    ========================================================= */

    .empty-message {
      padding: 28px;

      border:
        1px solid
        rgba(231, 190, 160, 0.45);

      border-radius: 18px;

      background:
        rgba(255, 255, 255, 0.72);

      color: #806f67;

      text-align: center;

      box-shadow:
        0 8px 24px
        rgba(157, 93, 55, 0.05);
    }


    /* =========================================================
   RESPONSIVE
========================================================= */

/* =========================================================
   TABLET
========================================================= */

@media (max-width: 980px) {

  .movie-hero {
    height: 560px;
    min-height: 560px;
  }

  .movie-hero-logo {
    width: 70%;
  }

  .movie-hero-nav {
    right: 18px;
  }

  .movie-hero-info {
    gap: 18px;
  }
}


/* =========================================================
   SMARTPHONE
========================================================= */

@media (max-width: 800px) {

  /* 背景画像はスマホでも切り取らない */
  .bg-top-image {
    width: 100%;
    height: auto;
  }

  :root {
    --middle-fade: clamp(42px, 12vw, 72px);
    --bottom-blend-zone: 420px;
  }

  .bg-middle-layer {
    top: calc(var(--top-image-height) - var(--middle-fade));
    bottom: 0;
    background-size: 100% auto;
  }

  .page-content {
    padding-bottom: 0;
  }

  /* ヘッダーは背景の高さとは独立 */
  .movie-hero {
    position: relative;
    width: 100%;
    height: 590px;
    min-height: 590px;
    overflow: visible;
    background: transparent;
  }

  .page-middle {
    margin: -35px 0 0;
    padding: 0;
    background: transparent;
  }
  
  /* ロゴ */
.movie-hero-logo-wrap {
  top: 72px;
  left: 50%;

  width: 92%;
  max-width: 520px;

  transform: translateX(-50%);
}

.movie-hero-logo {
  width: 100%;
  max-width: none;
  height: auto;
}

  /* 月選択 */
  .movie-hero-nav {
  position: relative;
  z-index: 20;

  display: grid;
  grid-template-columns: 82px 1fr 82px;
  align-items: center;

  width: 100%;

  gap: 8px;

  /* 上下に余裕を持たせる */
  margin: 14px 0 14px;
  padding: 0 4px;

  transform: none;
  top: auto;
  left: auto;
  right: auto;
}


/* 前月・翌月 */
.movie-hero-nav button {
  appearance: none;
  -webkit-appearance: none;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 82px;
  min-width: 82px;
  height: 42px;

  margin: 0;
  padding: 0 10px;

  border: 1px solid rgba(177, 111, 77, 0.20);
  border-radius: 999px;

  background: rgba(255, 255, 255, 0.92);

  color: #70402d;

  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  line-height: 1;

  white-space: nowrap;

  box-shadow:
    0 4px 12px
    rgba(119, 67, 42, 0.08);
}


/* 2026年10月 */
.movie-hero-nav .month-label {
  display: block;

  width: 100%;
  min-width: 0;

  margin: 0;

  color: #70402d;

  font-size: 20px;
  font-weight: 900;
  line-height: 1.2;

  text-align: center;
  white-space: nowrap;
}
  .movie-hero-nav button {
  appearance: none;
  -webkit-appearance: none;

  width: auto;
  min-width: 72px;
  height: 34px;

  padding: 0 10px;

  border-radius: 999px;

  font-size: 11px;
  white-space: nowrap;
}


  /* このサイトについて */
  .movie-hero-info {
    position: absolute;
    z-index: 5;

    top: 275px;
    left: 14px;
    right: 14px;
    bottom: auto;

    display: block;

    padding: 14px;

    border-radius: 18px;
  }

  .movie-hero-info-title {
    margin-bottom: 5px;

    font-size: 15px;
  }

  .movie-hero-description {
    font-size: 11px;
    line-height: 1.5;
  }

  .notice {
    margin-top: 6px;

    font-size: 9px;
    line-height: 1.45;
  }

  .movie-hero-update {
    margin-top: 9px;

    padding: 6px 10px;
  }


  /* ヘッダー直後 */
  .wrap {
    width: calc(100% - 20px);
    margin: 0 auto;
  }


  /* フィルター */
  .filters {
    margin: 0 0 10px;

    padding: 11px 12px;

    gap: 7px;

    border-radius: 15px;
  }

  .filter-row {
    gap: 6px;
  }

  .filter-label {

  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script>

    let events = [];

    let activeNewFilter = "すべて";
    let activeGenreFilter = "すべて";
    let activeRelationFilter = "すべて";
    let activeSort = "タイトル順";

    let current = new Date();


    const categoryColors = {
      "アニメ": "#b9dcf3",
      "洋画": "#f3c7c7",
      "邦画": "#c9e8ce",
      "特撮": "#f7e5a8",
      "音楽コンテンツ": "#e6cff2"
    };


    const timelineEl =
      document.getElementById(
        "timeline"
      );

    const monthLabelEl =
      document.getElementById(
        "monthLabel"
      );

    const filtersEl =
      document.getElementById(
        "filters"
      );


    /* =======================================================
       DATA LOAD
    ======================================================== */

    async function loadEvents() {

      try {

        const response =
          await fetch(
            "./data.json",
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `data.jsonの読み込みに失敗しました：${response.status}`
          );
        }


        const loadedData =
          await response.json();


        if (
          !loadedData ||
          typeof loadedData !== "object" ||
          !Array.isArray(
            loadedData.movies
          )
        ) {

          throw new Error(
            "data.jsonの形式が正しくありません"
          );
        }


        const lastUpdateEl =
          document.getElementById(
            "lastUpdate"
          );


        if (lastUpdateEl) {

          lastUpdateEl.textContent =
            loadedData.lastUpdated ||
            "----.--.--";
        }


        events =
          loadedData.movies

            .filter(event => {

              return (
                event &&
                event.date &&
                event.title
              );

            })

            .map(event => ({

              date:
                String(
                  event.date || ""
                ),

              title:
                String(
                  event.title || ""
                ),

              category:
                String(
                  event.category || ""
                ),

              tohoUrl:
                String(
                  event.tohoUrl || ""
                ),

              dmmUrl:
                String(
                  event.dmmUrl || ""
                ),

              trendUrl:
                String(
                  event.trendUrl || ""
                ),

              dmmKeyword:
                String(
                  event.dmmKeyword || ""
                ),

              dmmCount:
                normalizeCount(
                  event.dmmCount
                ),

              relationType:
                String(
                  event.relationType ||
                  ""
                ),

              newLabel:
                String(
                  event.newLabel || ""
                )

            }))

            .sort(
              (a, b) => {

                return (

                  a.date.localeCompare(
                    b.date
                  )

                  ||

                  a.title.localeCompare(
                    b.title,
                    "ja"
                  )

                );

              }
            );


        setInitialMonth();

        renderFilters();

        renderTimeline();


      } catch (error) {

        console.error(error);


        timelineEl.innerHTML =
          '<div class="empty-message">' +
          'data.jsonの読み込みに失敗しました' +
          '</div>';

      }

    }


    /* =======================================================
       HELPERS
    ======================================================== */

    function normalizeCount(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return null;
      }


      const number =
        Number(value);


      return Number.isFinite(number)
        ? number
        : null;
    }


    function parseDate(
      dateString
    ) {

      if (
        !/^\d{4}-\d{2}-\d{2}$/
          .test(dateString)
      ) {

        return null;
      }


      const [
        year,
        month,
        day
      ] =
        dateString
          .split("-")
          .map(Number);


      return new Date(
        year,
        month - 1,
        day
      );
    }


    /* =======================================================
       INITIAL MONTH
    ======================================================== */

    function setInitialMonth() {

      const saved =
        localStorage.getItem(
          "movieCalendarMonth"
        );


      if (
        saved &&
        /^\d{4}-\d{2}$/.test(saved)
      ) {

        const [
          year,
          month
        ] =
          saved
            .split("-")
            .map(Number);


        current =
          new Date(
            year,
            month - 1,
            1
          );


        return;
      }


      const today =
        new Date();


      today.setHours(
        0,
        0,
        0,
        0
      );


      const firstFuture =
        events.find(
          event => {

            const date =
              parseDate(
                event.date
              );


            return (
              date &&
              date >= today
            );

          }
        );


      const base =
        firstFuture

          ? parseDate(
              firstFuture.date
            )

          : parseDate(
              events[0]?.date ||
              ""
            );


      if (base) {

        current =
          new Date(
            base.getFullYear(),
            base.getMonth(),
            1
          );
      }

    }


    function saveCurrentMonth() {

      const value =
        `${current.getFullYear()}-` +
        `${String(
          current.getMonth() + 1
        ).padStart(
          2,
          "0"
        )}`;


      localStorage.setItem(
        "movieCalendarMonth",
        value
      );
    }


    /* =======================================================
       FILTERS
    ======================================================== */

    function renderFilters() {

      filtersEl.innerHTML = "";


      const newOptions = [
        "すべて",
        "NEW"
      ];


      const genres = [
        "すべて",

        ...new Set(

          events

            .map(
              event =>
                event.category
            )

            .filter(Boolean)

        )
      ];


      const relationTypes = [
        "すべて",

        ...new Set(

          events

            .map(
              event =>
                event.relationType
            )

            .filter(Boolean)

        )
      ];


      const newRow =
        createFilterRow(

          "NEW",

          newOptions,

          activeNewFilter,

          value => {

            activeNewFilter =
              value;

            renderFilters();

            renderTimeline();

          }

        );


      const genreRow =
        createFilterRow(

          "ジャンル",

          genres,

          activeGenreFilter,

          value => {

            activeGenreFilter =
              value;

            renderFilters();

            renderTimeline();

          }

        );


      const relationRow =
        createFilterRow(

          "関連タイプ",

          relationTypes,

          activeRelationFilter,

          value => {

            activeRelationFilter =
              value;

            renderFilters();

            renderTimeline();

          }

        );


      const sortRow =
        createFilterRow(

          "並び順",

          [
            "タイトル順",
            "関連数順"
          ],

          activeSort,

          value => {

            activeSort =
              value;

            renderFilters();

            renderTimeline();

          }

        );


      filtersEl.append(
        newRow,
        genreRow,
        relationRow,
        sortRow
      );

    }


    function createFilterRow(
      labelText,
      options,
      activeValue,
      onSelect
    ) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "filter-row";


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "filter-label";


      label.textContent =
        labelText;


      const buttons =
        document.createElement(
          "div"
        );


      buttons.className =
        "filter-buttons";


      options.forEach(
        option => {

          const button =
            document.createElement(
              "button"
            );


          button.textContent =
            option;


          button.className =
            option === activeValue
              ? "active"
              : "";


          button.addEventListener(
            "click",
            () =>
              onSelect(option)
          );


          buttons.appendChild(
            button
          );

        }
      );


      row.append(
        label,
        buttons
      );


      return row;
    }


    /* =======================================================
       TIMELINE
    ======================================================== */

    function renderTimeline() {

      timelineEl.innerHTML = "";


      const year =
        current.getFullYear();


      const month =
        current.getMonth();


      monthLabelEl.textContent =
        `${year}年${month + 1}月`;


      const monthEvents =
        events.filter(
          event => {

            const date =
              parseDate(
                event.date
              );


            if (!date) {

              return false;
            }


            if (
              date.getFullYear() !==
                year

              ||

              date.getMonth() !==
                month
            ) {

              return false;
            }


            const matchesNew =

              activeNewFilter ===
                "すべて"

              ||

              String(
                event.newLabel || ""
              )
                .trim()
                .toUpperCase() ===
                "NEW";


            const matchesGenre =

              activeGenreFilter ===
                "すべて"

              ||

              event.category ===
                activeGenreFilter;


            const matchesRelation =

              activeRelationFilter ===
                "すべて"

              ||

              event.relationType ===
                activeRelationFilter;


            return (
              matchesNew &&
              matchesGenre &&
              matchesRelation
            );

          }
        );


      /* =====================================================
         NO RESULT
      ====================================================== */

      if (
        monthEvents.length === 0
      ) {

        const hasMonthData =
          events.some(
            event => {

              const date =
                parseDate(
                  event.date
                );


              return (

                date

                &&

                date.getFullYear() ===
                  year

                &&

                date.getMonth() ===
                  month

              );

            }
          );


        const dataStartDate =
          new Date(
            2026,
            5,
            1
          );


        const viewingMonth =
          new Date(
            year,
            month,
            1
          );


        if (hasMonthData) {

          timelineEl.innerHTML =
            '<div class="empty-message">' +
            'この条件に該当する作品はありません' +
            '</div>';

        }

        else if (
          viewingMonth <
          dataStartDate
        ) {

          timelineEl.innerHTML =
            '<div class="empty-message">' +
            'この期間のデータは掲載していません' +
            '</div>';

        }

        else {

          timelineEl.innerHTML =
            '<div class="empty-message">' +
            'この月以降の公開予定作品は、まだ情報が公開されていません。<br>' +
            '情報が確認でき次第、順次更新します。' +
            '</div>';

        }


        syncBackgroundLayout();
        return;
      }


      /* =====================================================
         GROUP BY DATE
      ====================================================== */

      const grouped =
        new Map();


      monthEvents.forEach(
        event => {

          if (
            !grouped.has(
              event.date
            )
          ) {

            grouped.set(
              event.date,
              []
            );
          }


          grouped
            .get(
              event.date
            )
            .push(event);

        }
      );


      [...grouped.entries()]

        .sort(
          (a, b) => {

            return (
              a[0]
                .localeCompare(
                  b[0]
                )
            );

          }
        )

        .forEach(
          ([
            dateKey,
            dayEvents
          ]) => {

            const sortedEvents =
              sortDayEvents(
                dayEvents
              );


            timelineEl.appendChild(

              createDateRow(
                dateKey,
                sortedEvents
              )

            );

          }
        );

      syncBackgroundLayout();

    }


    /* =======================================================
       SORT
    ======================================================== */

    function sortDayEvents(
      dayEvents
    ) {

      const copied =
        [...dayEvents];


      if (
        activeSort ===
        "関連数順"
      ) {

        return copied.sort(
          (a, b) => {

            const countA =
              a.dmmCount === null
                ? -1
                : a.dmmCount;


            const countB =
              b.dmmCount === null
                ? -1
                : b.dmmCount;


            return (

              countB - countA

              ||

              a.title.localeCompare(
                b.title,
                "ja"
              )

            );

          }
        );

      }


      return copied.sort(
        (a, b) => {

          return (
            a.title.localeCompare(
              b.title,
              "ja"
            )
          );

        }
      );

    }


    /* =======================================================
       DATE ROW
    ======================================================== */

    function createDateRow(
      dateKey,
      dayEvents
    ) {

      const row =
        document.createElement(
          "article"
        );


      row.className =
        "date-row";


      const date =
        parseDate(
          dateKey
        );


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "date-label";


      label.innerHTML =

        `${date.getMonth() + 1}/${date.getDate()}`

        +

        `<span class="weekday">`

        +

        `（${
          [
            "日",
            "月",
            "火",
            "水",
            "木",
            "金",
            "土"
          ][
            date.getDay()
          ]
        }）`

        +

        `</span>`;


      const movies =
        document.createElement(
          "div"
        );


      movies.className =
        "movies";


      dayEvents.forEach(
        event => {

          movies.appendChild(

            createMovieCard(
              event
            )

          );

        }
      );


      row.append(
        label,
        movies
      );


      return row;
    }


    /* =======================================================
       MOVIE CARD
    ======================================================== */

    function createMovieCard(
      event
    ) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "movie-card";


      card.style.setProperty(

        "--category-color",

        categoryColors[
          event.category
        ]

        ||

        "#dfe3ea"

      );


      /* NEW */

      if (

        String(
          event.newLabel || ""
        )
          .trim()
          .toUpperCase() ===
          "NEW"

      ) {

        const badge =
          document.createElement(
            "div"
          );


        badge.className =
          "movie-new-ribbon";


        card.appendChild(
          badge
        );

      }


      /* MAIN */

      const main =
        document.createElement(
          "div"
        );


      main.className =
        "movie-main";


      const title =
        document.createElement(

          event.tohoUrl
            ? "a"
            : "div"

        );


      title.className =
        "movie-title";


      title.textContent =
        event.title;


      if (
        event.tohoUrl
      ) {

        title.href =
          event.tohoUrl;


        title.target =
          "_blank";


        title.rel =
          "noopener noreferrer";

      }


      main.appendChild(
        title
      );


      if (
        event.category
      ) {

        const tag =
          document.createElement(
            "span"
          );


        tag.className =
          "category-tag";


        tag.textContent =
          event.category;


        main.appendChild(
          tag
        );

      }


      /* META */

      const meta =
        document.createElement(
          "div"
        );


      meta.className =
        "movie-meta";


      const metaItems = [];


      if (
        event.dmmKeyword
      ) {

        metaItems.push([
          "DMM検索KW",
          event.dmmKeyword
        ]);

      }


      if (
        event.dmmCount !== null
      ) {

        metaItems.push([
          "関連作品数",
          `${event.dmmCount}件`
        ]);

      }


      if (
        event.relationType
      ) {

        metaItems.push([
          "関連タイプ",
          event.relationType
        ]);

      }


      metaItems.forEach(
        ([
          labelText,
          valueText
        ]) => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "meta-row";


          const label =
            document.createElement(
              "span"
            );


          label.className =
            "meta-label";


          label.textContent =
            labelText;


          const colon =
            document.createElement(
              "span"
            );


          colon.className =
            "meta-colon";


          colon.textContent =
            "：";


          const value =
            document.createElement(
              "span"
            );


          value.className =
            "meta-value";


          value.textContent =
            valueText;


          row.append(
            label,
            colon,
            value
          );


          meta.appendChild(
            row
          );

        }
      );


      /* LINKS */

      const links =
        document.createElement(
          "div"
        );


      links.className =
        "movie-links";


      links.appendChild(

        event.dmmUrl

          ? makeLink(
              event.dmmUrl,
              "🎬 DMM"
            )

          : makePlaceholder(
              "🎬 DMM"
            )

      );


      links.appendChild(

        event.trendUrl

          ? makeLink(
              event.trendUrl,
              "📈 Trend"
            )

          : makePlaceholder(
              "📈 Trend"
            )

      );


      card.append(
        main,
        meta,
        links
      );


      return card;
    }


    /* =======================================================
       LINKS
    ======================================================== */

    function makeLink(
      url,
      text
    ) {

      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.target =
        "_blank";


      link.rel =
        "noopener noreferrer";


      link.textContent =
        text;


      return link;
    }


    function makePlaceholder(
      text
    ) {

      const span =
        document.createElement(
          "span"
        );


      span.className =
        "movie-link-placeholder";


      span.textContent =
        text;


      return span;
    }


    /* =======================================================
       BACKGROUND LAYOUT SYNC
       ページ高さは常に前面コンテンツの実高だけ。
       下部画像のための高さは一切追加しない。
       フィルター・月変更・カード描画後もこの高さだけ同期する。
    ======================================================== */

    const pageStageEl = document.querySelector(".page-stage");
    const pageContentEl = document.querySelector(".page-content");
    const topImageEl = document.querySelector(".bg-top-image");

    let backgroundLayoutFrame = 0;

    function syncBackgroundLayout() {
      cancelAnimationFrame(backgroundLayoutFrame);

      backgroundLayoutFrame = requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (!pageStageEl || !pageContentEl) return;

          /*
            offsetHeight = 実際に表示されているUIの高さ。
            下部背景の高さ・画像比率・検索件数による最低高さは足さない。
          */
          const contentHeight = Math.max(1, Math.ceil(pageContentEl.offsetHeight));

          /*
            フェード幅も表示中コンテンツの高さから毎回決める。
            件数が少ない時は短く、多い時は最大420px。
            これで短い検索結果でも中部→下部のクロスフェードが潰れない。
          */
          const isMobile = window.matchMedia("(max-width: 800px)").matches;
          const maxBlend = isMobile ? 610 : 750;
          const minBlend = isMobile ? 410 : 490;
          const dynamicBlend = Math.max(
            minBlend,
            Math.min(maxBlend, Math.round(contentHeight * 0.34))
          );

          pageStageEl.style.setProperty("--bottom-blend-zone", `${dynamicBlend}px`);
          pageStageEl.style.height = `${contentHeight}px`;
          pageStageEl.style.minHeight = "0";
        });
      });
    }

    if (topImageEl) {
      if (topImageEl.complete) {
        syncBackgroundLayout();
      } else {
        topImageEl.addEventListener("load", syncBackgroundLayout, { once: true });
      }
    }

    window.addEventListener("resize", syncBackgroundLayout);

    if ("ResizeObserver" in window && pageContentEl) {
      const backgroundResizeObserver = new ResizeObserver(() => {
        syncBackgroundLayout();
      });
      backgroundResizeObserver.observe(pageContentEl);
      if (timelineEl) backgroundResizeObserver.observe(timelineEl);
    }

    /* =======================================================
       MONTH BUTTONS
    ======================================================== */

    document
      .getElementById("prev")
      .addEventListener(
        "click",
        () => {

          current =
            new Date(
              current.getFullYear(),
              current.getMonth() - 1,
              1
            );


          saveCurrentMonth();

          renderTimeline();

        }
      );


    document
      .getElementById("next")
      .addEventListener(
        "click",
        () => {

          current =
            new Date(
              current.getFullYear(),
              current.getMonth() + 1,
              1
            );


          saveCurrentMonth();

          renderTimeline();

        }
      );


    /* =======================================================
       START
    ======================================================== */

    loadEvents();

  </script>

</body>
</html>
